# cargo-deny policy. CI runs `cargo deny check` on every PR.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained-crate notices with no upgrade path. Both are Linux-only
# transitive dependencies of the tray (`cargo tree -i <crate> --target all`),
# not on the proxy's serving path; revisit when tray-icon/winit move off them.
ignore = [
  # tray-icon -> libappindicator/muda -> gtk 0.18 -> glib-macros 0.18 -> proc-macro-error
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: pulled by gtk 0.18 via tray-icon on Linux; no released gtk-rs 0.18 replacement" },
  # winit 0.30 -> sctk-adwaita (Wayland client-side decorations) -> ab_glyph -> ttf-parser
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser: pulled by winit's Wayland decorations on Linux; no released winit/sctk-adwaita without it" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
  "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
